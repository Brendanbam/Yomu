name: Yomu Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Yomu Release
    runs-on: ubuntu-latest

    steps:
      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/yomu-release.jks"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build signed release APKs
        run: ./gradlew :app:assembleRelease
        env:
          storeFile: ${{ runner.temp }}/yomu-release.jks
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename release APKs for Obtainium
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          mv app/build/outputs/apk/release/app-universal-release.apk "yomu-${TAG}-universal.apk"
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk "yomu-${TAG}-arm64-v8a.apk"
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk "yomu-${TAG}-armeabi-v7a.apk"
          mv app/build/outputs/apk/release/app-x86-release.apk "yomu-${TAG}-x86.apk"
          mv app/build/outputs/apk/release/app-x86_64-release.apk "yomu-${TAG}-x86_64.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Yomu ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Yomu — Your Manga Sanctuary (${{ steps.meta.outputs.tag }})

            - **Recommended for modern phones & tablets (e.g. Legion Y700):** `yomu-${{ steps.meta.outputs.tag }}-arm64-v8a.apk`
            - **Universal APK (all Android ABIs):** `yomu-${{ steps.meta.outputs.tag }}-universal.apk`

            ### Obtainium Setup
            Add `https://github.com/Brendanbam/Yomu` in Obtainium and set **Filter APKs by Regular Expression** to `arm64-v8a` (or `universal`).
          files: |
            yomu-${{ steps.meta.outputs.tag }}-universal.apk
            yomu-${{ steps.meta.outputs.tag }}-arm64-v8a.apk
            yomu-${{ steps.meta.outputs.tag }}-armeabi-v7a.apk
            yomu-${{ steps.meta.outputs.tag }}-x86.apk
            yomu-${{ steps.meta.outputs.tag }}-x86_64.apk
