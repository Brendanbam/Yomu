name: Yomu Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semantic version tag (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, Sign & Publish Yomu Release
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag and checkout exact ref
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected format vMAJOR.MINOR.PATCH (e.g. v2.0.0)."
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist in this repository. Push an annotated tag first."
            exit 1
          fi

          git checkout --detach "refs/tags/${TAG}"
          VERSION_NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Verify signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Required signing secret '${var}' is not configured."
              exit 1
            fi
          done

      - name: Run quality gates (Spotless, Unit Tests, SQLDelight Migrations)
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          ./gradlew spotlessCheck testDebugUnitTest verifySqlDelightMigration -PyomuVersionName="${VERSION_NAME}"

      - name: Decode release signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY" | base64 -d > "${RUNNER_TEMP}/yomu-release.jks"
          chmod 600 "${RUNNER_TEMP}/yomu-release.jks"

      - name: Build signed release APKs
        env:
          MIHON_GITHUB_RELEASE: 'true'
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          storeFile: ${{ runner.temp }}/yomu-release.jks
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -Pdist=github -PyomuVersionName="${VERSION_NAME}"

      - name: Verify APK metadata, signatures, and prepare release assets
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"

          mkdir -p release-assets
          ABIS=(universal arm64-v8a armeabi-v7a x86 x86_64)
          for abi in "${ABIS[@]}"; do
            SRC="app/build/outputs/apk/release/app-${abi}-release.apk"
            DST="release-assets/yomu-${TAG}-${abi}.apk"
            if [ ! -f "$SRC" ]; then
              echo "::error::Expected APK not found: ${SRC}"
              exit 1
            fi

            BADGING="$("$AAPT2" dump badging "$SRC")"
            if ! grep -q "package: name='app.yomu'" <<< "$BADGING"; then
              echo "::error::Unexpected applicationId in ${SRC}"
              exit 1
            fi
            if ! grep -q "versionName='${VERSION_NAME}'" <<< "$BADGING"; then
              echo "::error::Version mismatch in ${SRC}; expected versionName='${VERSION_NAME}'"
              exit 1
            fi

            "$APKSIGNER" verify --verbose "$SRC"
            cp "$SRC" "$DST"
          done

          (cd release-assets && sha256sum yomu-"${TAG}"-*.apk > "yomu-${TAG}-checksums.sha256")
          rm -f "${RUNNER_TEMP}/yomu-release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          ## Yomu — Your Manga Sanctuary (${TAG})

          - **Recommended for modern 64-bit Android phones & tablets (e.g. Legion Y700):** \`yomu-${TAG}-arm64-v8a.apk\`
          - **Universal APK (all Android ABIs):** \`yomu-${TAG}-universal.apk\`
          - **SHA-256 Checksums:** \`yomu-${TAG}-checksums.sha256\`

          ### Obtainium Setup
          Add \`https://github.com/Brendanbam/Yomu\` in Obtainium and set **Filter APKs by Regular Expression** to \`arm64-v8a\\.apk$\` (or \`universal\\.apk$\`).
          EOF

          gh release create "$TAG" \
            release-assets/yomu-"${TAG}"-universal.apk \
            release-assets/yomu-"${TAG}"-arm64-v8a.apk \
            release-assets/yomu-"${TAG}"-armeabi-v7a.apk \
            release-assets/yomu-"${TAG}"-x86.apk \
            release-assets/yomu-"${TAG}"-x86_64.apk \
            release-assets/yomu-"${TAG}"-checksums.sha256 \
            --verify-tag \
            --title "Yomu ${TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --generate-notes
