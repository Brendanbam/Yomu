name: Yomu Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semantic version tag (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, Sign & Publish Yomu Release
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag and checkout exact ref
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected format vMAJOR.MINOR.PATCH (e.g. v2.0.0)."
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist in this repository. Push an annotated tag first."
            exit 1
          fi

          git checkout --detach "refs/tags/${TAG}"
          VERSION_NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Verify signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Required signing secret '${var}' is not configured."
              exit 1
            fi
          done

      - name: Run quality gates (Spotless, Unit Tests, SQLDelight Migrations)
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          ./gradlew spotlessCheck testDebugUnitTest verifySqlDelightMigration -PyomuVersionName="${VERSION_NAME}"

      - name: Decode release signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY" | base64 -d > "${RUNNER_TEMP}/yomu-release.jks"
          chmod 600 "${RUNNER_TEMP}/yomu-release.jks"

      - name: Build signed release APKs
        env:
          MIHON_GITHUB_RELEASE: 'true'
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          storeFile: ${{ runner.temp }}/yomu-release.jks
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -Pdist=github -PyomuVersionName="${VERSION_NAME}"

      - name: Verify APK metadata, signatures, and prepare release assets
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"

          certificate_sha256() {
            local fingerprint
            fingerprint="$(
              "$APKSIGNER" verify --print-certs "$1" |
                sed -nE 's/.*[[:space:]]certificate SHA-256 digest:[[:space:]]*([[:xdigit:]]{64})[[:space:]]*$/\1/p' |
                tr '[:upper:]' '[:lower:]' |
                sort -u
            )" || return 1
            if ! [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Expected exactly one unique signing certificate SHA-256 digest in $1" >&2
              return 1
            fi
            printf '%s\n' "$fingerprint"
          }

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE="$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))"
          CERTIFICATE=""
          mkdir -p release-assets
          ABIS=(universal arm64-v8a armeabi-v7a x86 x86_64)
          for abi in "${ABIS[@]}"; do
            SRC="app/build/outputs/apk/release/app-${abi}-release.apk"
            DST="release-assets/yomu-${TAG}-${abi}.apk"
            if [ ! -f "$SRC" ]; then
              echo "::error::Expected APK not found: ${SRC}"
              exit 1
            fi

            BADGING="$("$AAPT2" dump badging "$SRC")"
            if ! grep -q "package: name='app.yomu'" <<< "$BADGING"; then
              echo "::error::Unexpected applicationId in ${SRC}"
              exit 1
            fi
            if ! grep -q "versionName='${VERSION_NAME}'" <<< "$BADGING"; then
              echo "::error::Version mismatch in ${SRC}; expected versionName='${VERSION_NAME}'"
              exit 1
            fi

            if ! grep -Fq "versionCode='$VERSION_CODE'" <<< "$BADGING"; then
              echo "::error::Unexpected versionCode in $SRC"
              exit 1
            fi

            # Inspect the actual native libraries, not just the asset filename.
            NATIVE_ABIS="$(unzip -Z1 "$SRC" | awk -F/ '$1 == "lib" && NF >= 3 {print $2}' | sort -u)"
            if [ "$abi" = universal ]; then
              for expected in arm64-v8a armeabi-v7a x86 x86_64; do
                grep -Fxq "$expected" <<< "$NATIVE_ABIS" || { echo "::error::Universal APK missing $expected"; exit 1; }
              done
            elif [ "$NATIVE_ABIS" != "$abi" ]; then
              echo "::error::Unexpected native libraries in $SRC: $NATIVE_ABIS"
              exit 1
            fi

            "$APKSIGNER" verify --verbose "$SRC"
            DIGEST="$(certificate_sha256 "$SRC")"
            if [ -z "$CERTIFICATE" ]; then
              CERTIFICATE="$DIGEST"
            elif [ "$CERTIFICATE" != "$DIGEST" ]; then
              echo "::error::APK signing certificates differ"
              exit 1
            fi
            cp "$SRC" "$DST"
          done

          # Compare the signing identity and installed version code with the latest published stable APK.
          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [ "$PREVIOUS_TAG" = "$TAG" ]; then
            echo "::error::Release $TAG is already published; refusing to replace its assets"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/yomu-previous"
          gh release download "$PREVIOUS_TAG" \
            --pattern "yomu-${PREVIOUS_TAG}-arm64-v8a.apk" \
            --pattern "yomu-${PREVIOUS_TAG}-x86_64.apk" \
            --dir "$RUNNER_TEMP/yomu-previous"
          PREVIOUS_APK="$RUNNER_TEMP/yomu-previous/yomu-${PREVIOUS_TAG}-arm64-v8a.apk"
          PREVIOUS_CERT="$(certificate_sha256 "$PREVIOUS_APK")"
          PREVIOUS_CODE="$("$AAPT2" dump badging "$PREVIOUS_APK" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          if [ "$PREVIOUS_CERT" != "$CERTIFICATE" ] || ! [[ "$PREVIOUS_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le "$PREVIOUS_CODE" ]; then
            echo "::error::Release is not an upgrade of the previous signed production APK"
            exit 1
          fi
          echo "previous_x86_64=$RUNNER_TEMP/yomu-previous/yomu-${PREVIOUS_TAG}-x86_64.apk" >> "$GITHUB_OUTPUT"
          (cd release-assets && sha256sum yomu-"${TAG}"-*.apk > "yomu-${TAG}-checksums.sha256")
      - name: Remove release signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/yomu-release.jks"

      - name: Install emulator system image
        run: bash .github/scripts/setup-yomu-ci-avd.sh

      - name: Install the signed update over the previous release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PREVIOUS_APK: ${{ steps.verified.outputs.previous_x86_64 }}
        run: bash .github/scripts/yomu-emulator-smoke.sh "release-assets/yomu-${TAG}-x86_64.apk" "$PREVIOUS_APK"

      - name: Upload signed upgrade diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-upgrade-diagnostics
          path: smoke-results/
          if-no-files-found: ignore

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          ## Yomu - Your Manga Sanctuary (${TAG})

          - **Recommended for modern 64-bit Android phones & tablets (e.g. Legion Y700):** \`yomu-${TAG}-arm64-v8a.apk\`
          - **Universal APK (all Android ABIs):** \`yomu-${TAG}-universal.apk\`
          - **SHA-256 Checksums:** \`yomu-${TAG}-checksums.sha256\`

          ### Obtainium Setup
          Add \`https://github.com/Brendanbam/Yomu\` in Obtainium and set **Filter APKs by Regular Expression** to \`arm64-v8a\\.apk$\` (or \`universal\\.apk$\`).
          EOF

          gh release create "$TAG" \
            release-assets/yomu-"${TAG}"-universal.apk \
            release-assets/yomu-"${TAG}"-arm64-v8a.apk \
            release-assets/yomu-"${TAG}"-armeabi-v7a.apk \
            release-assets/yomu-"${TAG}"-x86.apk \
            release-assets/yomu-"${TAG}"-x86_64.apk \
            release-assets/yomu-"${TAG}"-checksums.sha256 \
            --verify-tag \
            --title "Yomu ${TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

      - name: Retain verified APKs if publication fails
        if: failure() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-apks-${{ steps.meta.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 3

